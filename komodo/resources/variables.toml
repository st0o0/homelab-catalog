# Shared, non-secret variables — see README.md Guidelines for the conventions
# these encode. Referenced from komodo/resources/stacks.toml as [[VARIABLE_NAME]].
# Secrets (IPs, credentials, endpoints) live in komodo/secrets.sops.yaml and
# komodo/hosts/<host>/secrets.sops.yaml instead — see komodo/README.md.

[[variable]]
name = "TZ"
value = "Europe/Berlin"
description = "Default timezone for all stacks"

[[variable]]
name = "PUID"
value = "1000"
description = "Default container user id"

[[variable]]
name = "PGID"
value = "1000"
description = "Default container group id"
