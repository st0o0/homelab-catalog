x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  dockhand:
    image: fnsys/dockhand:latest
    container_name: ${DOCKHAND_CONTAINER_NAME:-dockhand}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - ${DOCKHAND_PORT:-8080}:3000
    environment:
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKHAND_DATA_PATH:-dockhand-data}:/app/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          memory: 128M

volumes:
  dockhand-data:
