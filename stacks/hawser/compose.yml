x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  hawser:
    image: ghcr.io/finsys/hawser:0.2.46
    container_name: ${HAWSER_CONTAINER_NAME:-hawser}
    restart: unless-stopped
    logging: *default-logging
    environment:
      - DOCKHAND_SERVER_URL=${DOCKHAND_SERVER_URL:-}
      - TOKEN=${TOKEN:?TOKEN is required}
      - AGENT_NAME=${AGENT_NAME:-}
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-30}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${STACKS_PATH:-hawser-stacks}:/data/stacks
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          memory: 128M

volumes:
  hawser-stacks:
