x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  alloy:
    image: grafana/alloy:v1.17.1
    container_name: alloy
    restart: unless-stopped
    logging: *default-logging
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    environment:
      - HOST_HOSTNAME=${HOST_HOSTNAME:?HOST_HOSTNAME is required}
      - SCRAPE_INTERVAL=${SCRAPE_INTERVAL:-30s}
      - REMOTE_WRITE_URL=${REMOTE_WRITE_URL:?REMOTE_WRITE_URL is required}
      - LOGS_PUSH_URL=${LOGS_PUSH_URL:?LOGS_PUSH_URL is required}
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 128M
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/log:/var/log/host:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  alloy-data:
