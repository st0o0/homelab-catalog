name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only when the "catalog" component (path ".") gets a release —
  # release-please leaves that package's outputs unprefixed since it's
  # the root path. Builds templates.json fresh and attaches it to the
  # GitHub Release that was just created, so
  # /releases/latest/download/templates.json is always the merged
  # output for that exact tagged version.
  publish-catalog:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Build catalog
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Verify output is valid JSON
        shell: pwsh
        run: Get-Content templates.json -Raw | ConvertFrom-Json | Out-Null

      - name: Attach templates.json to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" templates.json --clobber

  # Fast-forwards `stable` to the release tag and commits templates.json on
  # top of it. GitHub Release assets don't send Access-Control-Allow-Origin,
  # so a browser-based fetch (e.g. Dockhand adding this repo as a template
  # source) fails with a CORS error. raw.githubusercontent.com does send
  # that header, so serving templates.json from the stable branch is what
  # makes the browser fetch work.
  promote-stable:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Build catalog
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Commit templates.json and fast-forward stable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f templates.json
          git commit -m "chore(catalog): publish templates.json for ${{ needs.release-please.outputs.tag_name }}"
          git push origin HEAD:refs/heads/stable --force
