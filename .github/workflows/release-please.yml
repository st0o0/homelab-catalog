name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only when the "catalog" component (path ".") gets a release —
  # release-please leaves that package's outputs unprefixed since it's
  # the root path. Builds templates.json fresh and attaches it to the
  # GitHub Release that was just created, so
  # /releases/latest/download/templates.json is always the merged
  # output for that exact tagged version.
  publish-catalog:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Build catalog
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Verify output is valid JSON
        shell: pwsh
        run: Get-Content templates.json -Raw | ConvertFrom-Json | Out-Null

      - name: Attach templates.json to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" templates.json --clobber

  # Fast-forward stable to the release tag so it always points at the
  # latest release. No extra commits — just a branch pointer update.
  promote-stable:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Fast-forward stable to release tag
        run: git push origin "${{ needs.release-please.outputs.tag_name }}:refs/heads/stable" --force

  # Build the VitePress docs site with templates.json as a static asset
  # and deploy to GitHub Pages. This replaces the old pattern of
  # committing templates.json onto the stable branch for CORS — GitHub
  # Pages serves static assets with Access-Control-Allow-Origin headers.
  deploy-pages:
    needs: [release-please, publish-catalog]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Download templates.json from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ needs.release-please.outputs.tag_name }}" --pattern templates.json --dir docs/public

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build VitePress site
        run: npx vitepress build docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - uses: actions/deploy-pages@v4
        id: deployment
